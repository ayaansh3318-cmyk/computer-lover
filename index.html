<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 7 Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* Desktop Environment */
        #desktop {
            width: 100%;
            height: calc(100% - 40px);
            background: url('https://unsplash.com') no-repeat center center;
            background-size: cover;
            position: relative;
            padding: 20px;
        }

        /* Desktop Icons */
        .desktop-icon {
            width: 80px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            border: 1px solid transparent;
            border-radius: 3px;
        }

        .desktop-icon:hover {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }

        .desktop-icon img {
            width: 48px;
            height: 48px;
            margin-bottom: 5px;
        }

        .desktop-icon span {
            color: white;
            font-size: 12px;
            text-shadow: 1px 1px 3px black;
        }

        /* Aero Window Styling */
        .window {
            position: absolute;
            top: 100px;
            left: 100px;
            width: 500px;
            height: 350px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 7px 7px 0 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            display: none;
            flex-direction: column;
            z-index: 10;
        }

        .window-header {
            padding: 10px;
            background: linear-gradient(to bottom, rgba(198, 227, 247, 0.8), rgba(134, 184, 222, 0.8));
            border-radius: 6px 6px 0 0;
            border-bottom: 1px solid rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
        }

        .window-title {
            font-size: 13px;
            color: #154260;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .window-controls {
            display: flex;
            gap: 2px;
        }

        .win-btn {
            width: 28px;
            height: 18px;
            border: 1px solid rgba(0,0,0,0.3);
            border-radius: 3px;
            background: linear-gradient(to bottom, #fff, #bbb);
            cursor: pointer;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .win-btn.close {
            background: linear-gradient(to bottom, #f99, #c00);
            color: white;
        }

        .win-btn:hover {
            filter: brightness(1.2);
        }

        .window-body {
            padding: 15px;
            flex-grow: 1;
            background: white;
            font-size: 14px;
        }

        /* Taskbar Configuration */
        #taskbar {
            width: 100%;
            height: 40px;
            background: linear-gradient(to bottom, rgba(40, 70, 100, 0.85), rgba(20, 40, 60, 0.95));
            border-top: 1px solid rgba(255,255,255,0.2);
            position: absolute;
            bottom: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            z-index: 100;
        }

        #start-button {
            width: 36px;
            height: 36px;
            background: radial-gradient(circle, #52b7ff 0%, #004ba0 70%);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 150, 255, 0.8);
            transition: transform 0.1s;
        }

        #start-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 200, 255, 1);
        }

        .taskbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #system-tray {
            color: white;
            font-size: 12px;
            padding: 5px 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }

        /* Start Menu Settings */
        #start-menu {
            position: absolute;
            bottom: 40px;
            left: 5px;
            width: 380px;
            height: 450px;
            background: rgba(240, 245, 250, 0.95);
            border: 1px solid rgba(0,0,0,0.4);
            border-radius: 5px 5px 0 0;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            display: none;
            z-index: 99;
            grid-template-columns: 2fr 1fr;
            overflow: hidden;
        }

        .start-left {
            background: white;
            padding: 10px;
        }

        .start-right {
            background: linear-gradient(to right, rgba(200,220,240,0.6), rgba(170,200,230,0.6));
            border-left: 1px solid rgba(0,0,0,0.1);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 13px;
        }

        .menu-item {
            padding: 6px 10px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 13px;
        }

        .menu-item:hover {
            background: #e5f1fb;
        }
    </style>
</head>
<body>

    <!-- Desktop -->
    <div id="desktop">
        <!-- Desktop Icon -->
        <div class="desktop-icon" onclick="openWindow('computer-win')">
            <img src="https://icons8.com" alt="Computer">
            <span>Computer</span>
        </div>

        <!-- System Window (My Computer) -->
        <div id="computer-win" class="window">
            <div class="window-header" onmousedown="dragElement(this.parentElement)">
                <div class="window-title">
                    <img src="https://icons8.com" alt="icon">
                    Computer
                </div>
                <div class="window-controls">
                    <button class="win-btn">0</button>
                    <button class="win-btn">1</button>
                    <button class="win-btn close" onclick="closeWindow('computer-win')">X</button>
                </div>
            </div>
            <div class="window-body">
                <p><strong>Hard Disk Drives (1)</strong></p>
                <hr style="margin: 10px 0; border: 0; border-top: 1px solid #ccc;">
                <div style="display: flex; gap: 10px; align-items: center;">
                    <img src="https://icons8.com" alt="HDD">
                    <div>
                        <p style="font-size: 13px;">Local Disk (C:)</p>
                        <div style="width: 120px; height: 12px; border: 1px solid #999; background: #eee; margin: 3px 0;">
                            <div style="width: 65%; height: 100%; background: #30a030;"></div>
                        </div>
                        <p style="font-size: 11px; color: #666;">45.2 GB free of 119 GB</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu">
        <div class="start-left">
            <div class="menu-item">Internet Explorer</div>
            <div class="menu-item">Windows Media Player</div>
            <div class="menu-item" onclick="openWindow('computer-win'); toggleStartMenu();">Computer</div>
            <div class="menu-item">Notepad</div>
        </div>
        <div class="start-right">
            <div style="font-weight: bold; margin-bottom: 5px;">User</div>
            <div class="menu-item">Documents</div>
            <div class="menu-item">Pictures</div>
            <div class="menu-item">Control Panel</div>
            <div style="margin-top: auto;" class="menu-item">Shut Down</div>
        </div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar">
        <div class="taskbar-left">
            <div id="start-button" onclick="toggleStartMenu()"></div>
        </div>
        <div id="system-tray">
            <span id="clock">12:00 PM</span>
        </div>
    </div>

    <script>
        // Start Menu Toggle
        function toggleStartMenu() {
            const menu = document.getElementById('start-menu');
            menu.style.display = (menu.style.display === 'grid') ? 'none' : 'grid';
        }

        // Window Controls
        function openWindow(id) {
            document.getElementById(id).style.display = 'flex';
        }

        function closeWindow(id) {
            document.getElementById(id).style.display = 'none';
        }

        // Live Tray Clock
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock').textContent = `${hours}:${minutes} ${ampm}`;
        }
        setInterval(updateClock, 1000);
updateClock();
// Drag-and-Drop functionality for OS windows
function dragElement(elmnt) {
let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
const header = elmnt.querySelector('.window-header');
if (header) {
header.onmousedown = dragMouseDown;
}
function dragMouseDown(e) {
e = e || window.event;
e.preventDefault();
pos3 = e.clientX;
pos4 = e.clientY;
document.onmouseup = closeDragElement;
document.onmousemove = elementDrag;
}
function elementDrag(e) {
e = e || window.event;
e.preventDefault();
pos1 = pos3 - e.clientX;
pos2 = pos4 - e.clientY;
pos3 = e.clientX;
pos4 = e.clientY;
elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
}
function closeDragElement() {
document.onmouseup = null;
document.onmousemove = null;
}
}
